name: Repository checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Source, docs and helpers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify manifests, sources, branding and documentation
        run: python tools/validate.py
      - name: Test download, repack and source-preparation helpers
        run: python -m unittest discover -s tests -v
      - name: Check rescue kit shell scripts
        # Word splitting of find/blkid output is intentional; paths contain no spaces.
        run: shellcheck -s sh -S warning -e SC2046,SC2034,SC2174 rescue/enable-rescue.sh rescue/root/init rescue/root/etc/rescue/*.sh rescue/root/usr/bin/* tools/build_rescue.sh
  native-windows:
    name: Native Windows ISO assembly
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test built-in Windows PowerShell without a Python runtime dependency
        run: python -m unittest discover -s tests -p test_native_download.py -v
